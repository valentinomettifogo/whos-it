<!doctype html>
<html lang="en" class="bg-black text-slate-100 overflow-hidden select-none touch-none w-screen h-screen">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		
		<!-- PWA Support -->
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
		<link rel="shortcut icon" href="/icon-192.png" type="image/png" />
		<meta name="theme-color" content="#030307" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Who's It" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Space+Grotesk:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
		%sveltekit.head%
	</head>
	<body class="bg-black text-slate-100 overflow-hidden select-none touch-none w-screen h-screen overscroll-none" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
